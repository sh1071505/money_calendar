name: 시세 갱신
on:
  schedule:
    - cron: "40 21 * * *"   # 매일 06:40 KST (미국장 마감 후)
  workflow_dispatch:
  push:
    paths: ["data/watchlist.json"]
permissions:
  contents: write
concurrency: { group: prices, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update_prices.py
      - name: 변경 사항 저장
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || (git commit -m "시세 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d')" && git pull --rebase && git push)
