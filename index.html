<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계달력">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>가계 달력</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0C0E14;--bar:rgba(12,14,20,.86);--surface:#151821;--surface2:#1C2030;--sunk:#10131A;--line:#252A38;--line2:#323849;
  --ink:#ECEEF4;--muted:#8D93A6;--faint:#5E6477;
  --accent:#A78BFA;--accent-strong:#7C5CF0;--accent-soft:rgba(167,139,250,.15);--on-accent:#fff;
  --inc:#34D399;--inc-soft:rgba(52,211,153,.14);--inc-solid:#0F9F74;
  --exp:#FB7185;--exp-soft:rgba(251,113,133,.14);--exp-solid:#E0405E;
  --warn:#FBBF24;--warn-soft:rgba(251,191,36,.14);--fix:#60A5FA;--fix-soft:rgba(96,165,250,.14);--inst:#F472B6;--inst-soft:rgba(244,114,182,.14);
  --up:#FB7185;--down:#60A5FA;
  --float:0 10px 30px rgba(0,0,0,.55);
  --navh:62px;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;background:var(--bg)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body.lock{overflow:hidden}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
/* app bar */
.appbar{position:sticky;top:0;z-index:30;background:var(--bar);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid transparent}
.appbar.scrolled{border-bottom-color:var(--line)}
.appbar .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
.appbar h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-right:auto}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center}
.iconbtn:active{background:var(--surface2)}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-top:6px;padding-bottom:calc(var(--navh) + 110px + env(safe-area-inset-bottom,0px))}
/* bottom nav: 항상 하단 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--bar);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:760px;margin:0 auto;display:flex;height:var(--navh)}
.nav button{flex:1;border:0;background:transparent;color:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600}
.nav button[aria-selected="true"]{color:var(--accent)}
/* cards */
.card{background:var(--surface);border-radius:18px;padding:16px;min-width:0}
.card+.card,.gap{margin-top:12px}
.card h2{font-size:16px;margin:0;font-weight:700;text-wrap:balance}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stack-y{display:flex;flex-direction:column;gap:12px}
.btn{border:0;background:var(--surface2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.btn:active{filter:brightness(1.2)}
.btn.primary{background:var(--accent-strong);color:var(--on-accent)}
.btn.danger{background:var(--exp-soft);color:var(--exp)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
.seg{display:inline-flex;background:var(--sunk);padding:3px;border-radius:11px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}
.seg.full{display:flex}.seg.full button{flex:1}
.hint{font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}
.badge{font-size:11px;border-radius:6px;padding:2px 7px;font-weight:700;white-space:nowrap;display:inline-block}
.b-exp{background:var(--exp-soft);color:var(--exp)}.b-inc{background:var(--inc-soft);color:var(--inc)}
.b-fix{background:var(--fix-soft);color:var(--fix)}.b-inst{background:var(--inst-soft);color:var(--inst)}
.b-acc{background:var(--accent-soft);color:var(--accent)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-plan{background:var(--surface2);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:20px 0;text-align:center}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:3px}
.up{color:var(--up)}.down{color:var(--down)}
/* summary */
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border-radius:16px;padding:13px 14px;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.stat .s{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:640px){.sum{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* calendar */
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav .m{font-weight:700;font-size:18px;min-width:116px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;user-select:none;-webkit-user-select:none}
.dow{font-size:11.5px;color:var(--faint);text-align:center;padding:2px 0 6px;font-weight:600}
.dow.sun{color:var(--exp)}.dow.sat{color:var(--fix)}
.day{min-height:78px;border:0;border-radius:10px;padding:5px 4px;background:transparent;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0;touch-action:manipulation}
.day:active{background:var(--surface2)}
.day.out{opacity:.25}
.day.sel{background:var(--surface2);box-shadow:0 0 0 1.5px var(--accent) inset}
.day .d{font-size:12.5px;font-weight:700;margin-bottom:2px;padding-left:2px}
.day.sun .d{color:var(--exp)}.day.sat .d{color:var(--fix)}
.day.today .d span{background:var(--accent-strong);color:#fff;border-radius:10px;padding:0 6px}
.amt{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35;font-weight:600}
.amt.e{color:var(--exp)}.amt.i{color:var(--inc)}.amt.p{color:var(--faint);font-weight:500}
@media (max-width:520px){.amt .pl{display:none}.day{min-height:62px;padding:4px 2px}.amt{font-size:10px}}
.calfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}
/* rows */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border:0;background:transparent;text-align:left;width:100%;border-radius:12px}
button.row:active,.row.click:active{background:var(--surface2)}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .sub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.row.future{opacity:.55}
.cicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.dgroup{font-size:12.5px;color:var(--muted);font-weight:700;padding:14px 2px 2px}
/* FAB */
.fab{position:fixed;right:max(16px,calc((100vw - 760px)/2 + 16px));bottom:calc(var(--navh) + 14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:34}
.fab button{border:0;border-radius:28px;padding:13px 18px;font-weight:700;box-shadow:var(--float);display:flex;align-items:center;gap:6px;color:#fff;font-size:15px}
.fab .e{background:var(--exp-solid)}.fab .i{background:var(--inc-solid)}
/* assets */
.hero .k{font-size:13px;color:var(--muted)}
.hero .big{font-size:clamp(30px,8.5vw,40px);font-weight:800;letter-spacing:-.035em;line-height:1.15}
.hero .subs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.hero .subs .k{font-size:12px}
.hero .subs .v{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stackbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:16px 0 8px}
.stackbar span{display:block;height:100%}
.pricebar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.acc+.acc{border-top:1px solid var(--line)}
.acc-h{display:grid;grid-template-columns:40px minmax(0,1fr) auto 18px;gap:12px;align-items:center;width:100%;border:0;background:transparent;padding:12px 0;text-align:left}
.acc-h .nm{font-weight:700;display:block}
.acc-h .sub{font-size:12.5px;color:var(--muted);display:block}
.acc-h .vv{text-align:right}
.acc-h .vv b{display:block;font-size:15px}
.acc-h .vv span{font-size:12px;color:var(--muted)}
.acc-h .chev{transition:transform .15s;color:var(--faint)}
.acc.open .chev{transform:rotate(90deg)}
.acc-b{padding:0 0 12px 0}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;border:0;background:var(--sunk);border-radius:12px;width:100%;text-align:left;margin-top:6px}
.arow:active{background:var(--surface2)}
.arow .t{font-weight:600;display:flex;gap:6px;align-items:center;min-width:0}
.arow .t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .sub{font-size:12px;color:var(--muted);display:block;margin-top:2px;line-height:1.45}
.arow .r{text-align:right}
.arow .r b{display:block}
.arow .r span{font-size:12.5px}
.addline{margin-top:10px}
/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:active td{background:var(--surface2)}
tfoot td{font-weight:700;border-bottom:0}
/* flow */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.pcard{flex:none;width:150px;scroll-snap-align:center;border:0;border-radius:14px;background:var(--sunk);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.pcard.sel{background:var(--surface2);box-shadow:0 0 0 1.5px var(--accent) inset}
.pcard .lb{font-weight:700;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.pcard .ln{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.cb{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:12px}
.cb .cicon{width:30px;height:30px;border-radius:9px}
.cb .l{display:flex;justify-content:space-between;font-size:13.5px;gap:8px;margin-bottom:5px}
.cbgroup{font-size:13px;font-weight:700;color:var(--muted);margin:2px 0 10px}
/* charts */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart text{fill:var(--faint);font-size:11px;font-family:var(--sans)}
svg.chart .hov{fill:transparent}
/* report */
.kpis{display:flex;flex-wrap:wrap;gap:12px 26px;margin-bottom:12px}
.kpis .k{font-size:12.5px;color:var(--muted)}
.kpis .v{font-size:20px;font-weight:700}
.fxrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0}
.fxrow+.fxrow{border-top:1px solid var(--line)}
.fxrow .code{font-weight:800;font-size:13px;color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--sunk);border-radius:18px;padding:6px 13px;font-size:14px;color:var(--muted);font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.news{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ncard{background:var(--sunk);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:6px}
.ncard .nt{font-weight:700;line-height:1.4}
.ncard p{margin:0;color:#C9CDDA;font-size:14px;line-height:1.6}
.ncard .src{font-size:12px;color:var(--muted)}
.ncard .src a{color:var(--accent);text-decoration:none}
.headline{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.6;margin-bottom:12px}
textarea.note{width:100%;min-height:200px;border:0;border-radius:12px;padding:12px;background:var(--sunk);line-height:1.7;resize:vertical;font-size:15px}
.callout{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--muted);line-height:1.6}
/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.flabel{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea,.inp{border:1px solid transparent;border-radius:12px;padding:11px 12px;background:var(--sunk);width:100%;outline:0}
.field input:focus,.inp:focus{border-color:var(--accent)}
.inrow{display:flex;gap:8px;align-items:center}
.inrow input{flex:1;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent);padding:0;border:0;background:transparent}
.switch{width:50px;height:30px;border-radius:15px;border:0;background:var(--line2);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--inc-solid)}
.switch[aria-checked="true"]::after{left:23px}
.togrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc-tbl{max-height:440px;overflow:auto}
.calc-tbl thead th{position:sticky;top:0;background:var(--surface)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;width:min(560px,100%);max-height:92dvh;overflow:auto;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:4px auto 10px}
.sheet h3{margin:0;font-size:18px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
@media (min-width:700px){.scrim{align-items:center;padding:16px}.sheet{border-radius:22px;max-height:calc(100dvh - 32px)}}
.typeseg{display:flex;background:var(--sunk);padding:4px;border-radius:12px;gap:4px;margin-bottom:14px}
.typeseg button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:700;color:var(--muted)}
.typeseg button.on-e{background:var(--exp-solid);color:#fff}
.typeseg button.on-i{background:var(--inc-solid);color:#fff}
.sugg{display:flex;gap:6px;overflow-x:auto;margin:-6px 0 14px;scrollbar-width:none;padding-bottom:2px}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:none;border:0;background:var(--sunk);border-radius:12px;padding:6px 10px 6px 6px;display:flex;align-items:center;gap:7px;font-size:13.5px}
.sugg button .cicon{width:24px;height:24px;border-radius:7px}
.sugg button small{color:var(--muted);font-size:12px}
.amtdisp{font-size:30px;font-weight:800;text-align:right;padding:4px 4px 10px;outline:0;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.amtdisp.ph{color:var(--faint)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.keypad button{height:48px;border:0;border-radius:12px;background:var(--sunk);font-weight:700;font-size:18px;touch-action:manipulation}
.keypad button:active{background:var(--surface2)}
.keypad .q{color:var(--accent);background:var(--accent-soft);font-size:14px}
.keypad .z{color:var(--fix)}
.keypad .bk{color:var(--exp)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-bottom:16px}
.catgrid button{border:0;background:transparent;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.catgrid button .cicon{width:40px;height:40px;border-radius:13px}
.catgrid button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);box-shadow:0 0 0 1.5px var(--accent) inset}
.catgrid .add .cicon{border:1.5px dashed var(--line2);background:transparent;color:var(--accent)}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.actions .r{display:flex;gap:8px;margin-left:auto}
.actions .btn{padding:12px 18px;border-radius:12px;font-size:15px}
.calcline{font-size:12.5px;color:var(--muted);margin:-6px 0 14px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{border:0;border-radius:16px;padding:24px 10px;font-weight:800;font-size:16px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px}
.quick .e{background:var(--exp-solid)}.quick .i{background:var(--inc-solid)}
.secttl{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 10px}
/* settings category manager */
.cm-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0}
.cm-row .inp{padding:9px 10px}
.cm-ctrl{display:flex;gap:2px}
.cm-ctrl button{width:34px;height:34px;border:0;border-radius:10px;background:var(--sunk);color:var(--muted);display:grid;place-items:center}
.cm-ctrl button:disabled{opacity:.3}
.cm-iconbtn{border:0;padding:0;background:transparent}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;padding:8px;background:var(--sunk);border-radius:12px;margin:2px 0 8px}
.picker button{border:0;background:transparent;border-radius:10px;height:40px;display:grid;place-items:center;color:var(--muted)}
.picker button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:22px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.5}}}
</style>
</head>

/* ========== 반복·적립 계산 ========== */
function occInMonth(start,cycle,y,m,day){
  const s=pd(start);const first=new Date(y,m,1),last=new Date(y,m+1,0);if(last<s)return[];const out=[];
  if(cycle==='M'){const d=new Date(y,m,Math.min(day??s.getDate(),last.getDate()));if(d>=s)out.push(d)}
  else if(cycle==='Y'){if(m===s.getMonth()){const d=new Date(y,m,Math.min(s.getDate(),last.getDate()));if(d>=s)out.push(d)}}
  else if(cycle==='D'){for(let d=new Date(Math.max(first,s));d<=last;d.setDate(d.getDate()+1))out.push(new Date(d))}
  else{const step=cycle==='2W'?14:7;const a=new Date(s);
    if(day!=null&&cycle==='W')while(a.getDay()!==day)a.setDate(a.getDate()+1);
    if(a<first){const k=Math.ceil(Math.round((first-a)/864e5)/step);a.setDate(a.getDate()+k*step)}
    for(;a<=last;a.setDate(a.getDate()+step))out.push(new Date(a))}
  return out.map(ds);
}
function dcaDay(a){return a.dca.cycle==='D'?null:Number(a.dca.day)}
function dcaDatesBetween(a,after,upto){const out=[];if(!a.dca)return out;let ym=ymOf(a.dca.start>after?a.dca.start:after);const end=ymOf(upto);
  for(;ym<=end;ym=addMonths(ym,1)){const [y,m]=ym.split('-').map(Number);for(const d of occInMonth(a.dca.start,a.dca.cycle,y,m-1,dcaDay(a)))if(d>after&&d<=upto)out.push(d)}
  return out}
let EFF=new Map(),EFFV=-1;
function eff(a,St=S){
  if(St===S){if(EFFV!==VER){EFF=new Map();EFFV=VER}if(EFF.has(a.id))return EFF.get(a.id)}
  const fx=a.cur==='KRW'?1:(St.fx[a.cur]||1);const px=a.price*fx;let q=a.qty,cost=a.qty*(a.avg??a.price),n=0,spent=0;
  if(a.dca&&ACAT[a.cat].dca&&a.base)for(const d of dcaDatesBetween(a,a.base,TK)){const amt=a.dca.basis==='amt'?a.dca.value:a.dca.value*px;const addQ=a.dca.basis==='amt'?amt/px:a.dca.value;q+=addQ;cost+=addQ*a.price;n++;spent+=amt}
  const r={qty:q,avg:q?cost/q:0,value:q*px,n,spent};if(St===S)EFF.set(a.id,r);return r}
function totals(St=S){const by={};ACATS.forEach(c=>by[c.id]=0);for(const a of St.assets)by[a.cat]+=eff(a,St).value;
  const fin=ACATS.filter(c=>c.fin).reduce((s,c)=>s+by[c.id],0);const other=by.house+by.car;const debt=St.loans.reduce((s,l)=>s+l.principal,0);
  return {by,fin,other,total:fin+other,debt,netFin:fin-debt,net:fin+other-debt,interest:St.loans.reduce((s,l)=>s+l.interest,0)}}
function nextDca(a){if(!a.dca)return null;for(let k=0;k<3;k++){const ym=addMonths(ymOf(TK),k);const [y,m]=ym.split('-').map(Number);const d=occInMonth(a.dca.start,a.dca.cycle,y,m-1,dcaDay(a)).find(x=>x>TK);if(d)return d}return null}
function dcaLabel(a){const c=a.dca;const when=c.cycle==='W'?` ${DOW[c.day]}요일`:c.cycle==='M'?` ${c.day}일`:'';return `${DCYC[c.cycle]}${when} ${c.basis==='amt'?man(c.value)+'원':fmtQty(c.value,a.cat)+(ACAT[a.cat].unit||'개')}`}
let IDX=null;
function index(){if(IDX&&IDX.v===VER)return IDX;const plain=new Map(),rec=[];
  for(const t of S.tx){if(t.repeat||t.inst)rec.push(t);else{const k=ymOf(t.date);if(!plain.has(k))plain.set(k,[]);plain.get(k).push(t)}}
  IDX={v:VER,plain,rec,cache:new Map()};return IDX}
function monthOcc(y,m){const I=index();const key=ymKey(y,m);if(I.cache.has(key))return I.cache.get(key);const out=[];
  for(const t of I.plain.get(key)||[])out.push({...t,src:t.id,oid:t.id});
  for(const t of I.rec){
    if(t.inst){const s=pd(t.date);const k=(y-s.getFullYear())*12+(m-s.getMonth());const N=t.inst.months;
      if(k>=0&&k<N){const d=ds(new Date(y,m,Math.min(s.getDate(),dim(y,m))));const per=k<N-1?Math.round(t.amount/N):t.amount-Math.round(t.amount/N)*(N-1);
        out.push({...t,src:t.id,oid:t.id+'@'+d,date:d,amount:per,title:`${t.title} (${k+1}/${N})`})}}
    else for(const d of occInMonth(t.date,t.repeat,y,m))out.push({...t,src:t.id,oid:t.id+'@'+d,date:d})}
  for(const l of S.loans)if(key>=l.start&&l.interest>0)out.push({oid:'L'+l.id+key,src:l.id,auto:'loan',type:'expense',date:key+'-01',title:`${l.name} 이자`,cat:'대출이자',amount:l.interest,memo:''});
  for(const a of S.assets)if(a.dca&&ACAT[a.cat].dca)for(const d of occInMonth(a.dca.start,a.dca.cycle,y,m,dcaDay(a))){
    const amt=a.dca.basis==='amt'?a.dca.value:a.dca.value*a.price*fxr(a.cur);
    out.push({oid:'D'+a.id+d,src:a.id,auto:'dca',invest:true,type:'expense',date:d,title:`${a.name} 적립매수`,cat:'적립매수',amount:Math.round(amt),memo:''})}
  out.forEach(o=>o.future=o.date>TK);out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);I.cache.set(key,out);return out}
function mTot(y,m){let inc=0,exp=0,inv=0,finc=0,fexp=0;const bc={expense:{},income:{}};
  for(const o of monthOcc(y,m)){if(o.future){if(o.type==='income')finc+=o.amount;else fexp+=o.amount;continue}
    if(o.type==='income')inc+=o.amount;else{exp+=o.amount;if(o.invest)inv+=o.amount}bc[o.type][o.cat]=(bc[o.type][o.cat]||0)+o.amount}
  return {inc,exp,inv,finc,fexp,bc}}
function yTot(y){const r={inc:0,exp:0,inv:0,bc:{expense:{},income:{}},months:[]};
  for(let m=0;m<12;m++){const t=mTot(y,m);r.months.push(t);r.inc+=t.inc;r.exp+=t.exp;r.inv+=t.inv;for(const ty of ['expense','income'])for(const c in t.bc[ty])r.bc[ty][c]=(r.bc[ty][c]||0)+t.bc[ty][c]}return r}
function firstYM(){let f=ymOf(TK);for(const t of S.tx)if(ymOf(t.date)<f)f=ymOf(t.date);return f}
function snapshot(){const T=totals();const k=ymOf(TK);const snap={ym:k,by:{...T.by},fin:Math.round(T.fin),debt:T.debt,total:Math.round(T.total)};
  const i=S.history.findIndex(h=>h.ym===k);if(i>=0)S.history[i]=snap;else{S.history.push(snap);S.history.sort((a,b)=>a.ym<b.ym?-1:1)}}
function touch(){VER++;snapshot();save()}

function niceStep(max,t=4){const raw=max/t||1;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function axes(W,L,R,top,step,y){let g='';for(let v=0;v<=top+step/1e6;v+=step)g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${v?man(v):'0'}</text>`;return g}
function barChart({labels,series,h=210,sel=-1,every=1}){
  const W=640,H=h,L=50,R=4,T=10,B=24,iw=W-L-R,ih=H-T-B;const maxV=Math.max(1,...series.flatMap(s=>s.values));const step=niceStep(maxV);const top=Math.ceil(maxV/step)*step;const y=v=>T+ih-(v/top)*ih;
  const n=labels.length,gw=iw/n,bw=Math.max(3,Math.min(18,gw*.7/series.length));let b='',x='';
  labels.forEach((lb,i)=>{const cx=L+gw*i+gw/2,x0=cx-bw*series.length/2;
    series.forEach((s,j)=>{const v=s.values[i],yy=y(v);b+=`<rect x="${(x0+j*bw+.75).toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw-1.5).toFixed(1)}" height="${Math.max(0,T+ih-yy).toFixed(1)}" rx="3" style="fill:${s.color};opacity:${sel>=0&&sel!==i?.35:1}"><title>${esc(lb)} ${s.name} ${won(v)}원</title></rect>`});
    if(i%every===0||i===n-1)x+=`<text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle" ${i===sel?'style="fill:var(--ink);font-weight:700"':''}>${esc(lb)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${axes(W,L,R,top,step,y)}${b}${x}</svg>`}
function lineChart({labels,series,h=230,every=1}){
  const W=640,H=h,L=54,R=10,T=12,B=24,iw=W-L-R,ih=H-T-B;const vals=series.flatMap(s=>s.values).filter(v=>v!=null);
  const maxV=Math.max(1,...vals);const step=niceStep(maxV);const top=Math.ceil(maxV/step)*step;const y=v=>T+ih-(Math.max(0,v)/top)*ih;
  const n=labels.length;const xx=i=>n===1?L+iw/2:L+i*(iw/(n-1));let p='',x='',hov='';
  series.forEach((s,si)=>{const pts=s.values.map((v,i)=>v==null?null:[xx(i),y(v)]).filter(Boolean);if(!pts.length)return;
    const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
    if(s.area)p+=`<path d="${d} L${pts[pts.length-1][0].toFixed(1)} ${T+ih} L${pts[0][0].toFixed(1)} ${T+ih} Z" style="fill:${s.color};fill-opacity:.16;stroke:none"/>`;
    p+=`<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:${s.width||2.2};${s.dash?'stroke-dasharray:5 4;':''}stroke-linejoin:round;stroke-linecap:round"/>`;
    if(si===0){const e=pts[pts.length-1];p+=`<circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="4.5" style="fill:${s.color};stroke:var(--surface);stroke-width:2.5"/>`}});
  const cw=n>1?iw/(n-1):iw;
  labels.forEach((lb,i)=>{if(i%every===0||i===n-1)x+=`<text x="${xx(i).toFixed(1)}" y="${H-6}" text-anchor="${i===0&&n>1?'start':i===n-1&&n>1?'end':'middle'}">${esc(lb)}</text>`;
    hov+=`<rect class="hov" x="${(xx(i)-cw/2).toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${ih}"><title>${esc(lb)}\n${series.map(s=>s.values[i]==null?'':`${s.name} ${won(s.values[i])}원`).filter(Boolean).join('\n')}</title></rect>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${axes(W,L,R,top,step,y)}${p}${x}${hov}</svg>`}

  modal(`<div class="mhead"><h3 style="display:flex;align-items:center;gap:8px"><span style="color:${c.color}">${ic(c.icon,20)}</span>${A.id?'':'새 '}${c.name}${A.id?' 수정':''}</h3>${xbtn()}</div>${body}${dca}

  const ser=vals=>[showI?{name:'수입',color:'var(--inc)',values:vals.map(v=>v.inc)}:null,showE?{name:'지출',color:'var(--exp)',values:vals.map(v=>v.exp)}:null].filter(Boolean);

    const occ=monthOcc(sy,sm-1).filter(o=>(showI&&o.type==='income')||(showE&&o.type==='expense')).slice().reverse();const groups={};occ.forEach(o=>(groups[o.date]=groups[o.date]||[]).push(o));

    cards=years.map((y,i)=>pcard(String(y),`${y}년`,tv[i],y===Fl.selY,y===TODAY.getFullYear())).join('');const t=yTot(Fl.selY);
    detail=`<div class="card"><div class="chead"><h2>${Fl.selY}년 월별</h2><span class="hint">월을 누르면 내역으로</span></div><div class="tbl-wrap"><table><thead><tr><th>월</th>${showI?'<th class="r">수입</th>':''}${showE?'<th class="r">지출</th>':''}${showI&&showE?'<th class="r">합계</th>':''}</tr></thead>
      <tbody>${t.months.map((mt,i)=>(mt.inc||mt.exp)?`<tr class="click" data-goto="${Fl.selY}-${pad(i+1)}"><td>${i+1}월</td>${showI?`<td class="r num" style="color:var(--inc)">${won(mt.inc)}</td>`:''}${showE?`<td class="r num" style="color:var(--exp)">${won(mt.exp)}</td>`:''}${showI&&showE?`<td class="r num">${mt.inc-mt.exp>=0?'+':''}${won(mt.inc-mt.exp)}</td>`:''}</tr>`:'').join('')}</tbody>
      <tfoot><tr><td>합계</td>${showI?`<td class="r num">${won(t.inc)}</td>`:''}${showE?`<td class="r num">${won(t.exp)}</td>`:''}${showI&&showE?`<td class="r num">${t.inc-t.exp>=0?'+':''}${won(t.inc-t.exp)}</td>`:''}</tr></tfoot></table></div></div>
      <div class="card"><div class="chead"><h2>${Fl.selY}년 분류별</h2></div>${catBlock(t,showI,showE)}</div>`}

  bindRows('#view');const sel=$('#scroller .pcard.sel');if(sel){const sc=$('#scroller');sc.scrollLeft=sel.offsetLeft-sc.clientWidth/2+sel.clientWidth/2}

function pcard(key,label,t,sel,now){const Fl=UI.flow;
  return `<button type="button" class="pcard${sel?' sel':''}" data-pc="${key}"><span class="lb"><span>${label}</span>${now?'<span class="badge b-acc">지금</span>':''}</span>
    ${Fl.filter!=='expense'?`<span class="ln"><span>수입</span><span class="num" style="color:var(--inc)">${man(t.inc)}</span></span>`:''}${Fl.filter!=='income'?`<span class="ln"><span>지출</span><span class="num" style="color:var(--exp)">${man(t.exp)}</span></span>`:''}
    ${Fl.filter==='all'?`<span class="ln"><span>합계</span><span class="num" style="color:var(--ink)">${t.inc-t.exp>=0?'+':''}${man(t.inc-t.exp)}</span></span>`:''}</button>`}
function catBlock(t,showI,showE){
  const block=(type,map,color,label)=>{const order=S.cats[type].map(c=>c.name);const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);const max=arr[0]?.[1]||1;const sum=arr.reduce((s,x)=>s+x[1],0);

function fixedMonthly(){let s=0;for(const t of S.tx){if(t.type!=='expense')continue;if(t.repeat==='M')s+=t.amount;else if(t.repeat==='Y')s+=t.amount/12;else if(t.repeat==='W')s+=t.amount*52/12;else if(t.repeat==='2W')s+=t.amount*26/12}return s+S.loans.reduce((a,l)=>a+l.interest,0)}

function vCalc(){const T=totals();const C=CALC;const base=C.baseMode==='fin'?T.fin:C.baseMode==='net'?T.netFin:C.custom;
  const r=C.rate/100/12,inf=C.infl/100;const rows=[{y:0,c:base,v:base,real:base}];let v=base,c=base;
  for(let y=1;y<=C.years;y++){for(let k=0;k<12;k++){v=v*(1+r)+C.monthly;c+=C.monthly}rows.push({y,c,v,real:v/Math.pow(1+inf,y)})}
  const last=rows[rows.length-1];const yr0=TODAY.getFullYear();const every=Math.max(1,Math.ceil(C.years/6));
  const series=[{name:'평가금액',color:'var(--accent)',area:true,values:rows.map(x=>x.v)},{name:'누적 원금',color:'var(--muted)',values:rows.map(x=>x.c),width:1.6}];
  if(C.inflOn)series.push({name:'실질가치',color:'var(--warn)',dash:true,values:rows.map(x=>x.real)});
  $('#sub').innerHTML=`<div class="card"><div class="kpis"><div><div class="k">${C.years}년 후 평가금액</div><div class="v num" style="color:var(--accent)">${man(last.v)}원</div></div><div><div class="k">총 납입</div><div class="v num">${man(last.c)}원</div></div><div><div class="k">수익</div><div class="v num">${man(last.v-last.c)}원</div></div>${C.inflOn?`<div><div class="k">실질가치</div><div class="v num" style="color:var(--warn)">${man(last.real)}원</div></div>`:''}</div>
    ${lineChart({labels:rows.map(x=>x.y?`${x.y}년`:'지금'),series,every,h:240})}
    <div class="legend" style="margin-top:8px"><span><i style="background:var(--accent)"></i>평가금액</span><span><i style="background:var(--muted)"></i>누적 원금</span>${C.inflOn?'<span><i style="background:var(--warn)"></i>실질가치</span>':''}</div></div>
  <div class="card"><div class="chead"><h2>조건</h2><span class="hint">저장되지 않아요</span></div>
    <div class="seg full" style="margin-bottom:10px">${[['fin','금융자산'],['net','순금융자산'],['custom','직접 입력']].map(([k,l])=>`<button type="button" data-bm="${k}" aria-pressed="${C.baseMode===k}">${l}</button>`).join('')}</div>
    <div class="field"><input id="cBase" class="num" inputmode="numeric" value="${won(base)}" ${C.baseMode==='custom'?'':'readonly style="opacity:.7"'} aria-label="기준 자산"></div>

    <div class="field"><label for="cYears">기간 <b class="num" id="yLab" style="color:var(--ink)">${C.years}년</b> (${yr0+C.years}년까지)</label><input id="cYears" type="range" min="1" max="50" value="${C.years}"></div>

    ${C.inflOn?`<div class="field"><label for="cInf">연 물가상승률 (%)</label><input id="cInf" class="num" inputmode="decimal" value="${C.infl}"></div>`:''}

    <div class="tbl-wrap calc-tbl"><table><thead><tr><th>경과</th><th class="r">누적 원금</th><th class="r">평가금액</th><th class="r">배수</th>${C.inflOn?'<th class="r">실질가치</th>':''}</tr></thead>

  $('#addC').onclick=()=>{const v=$('#newC').value.trim();if(!v)return;if(arr.some(c=>c.name===v)){toast('이미 있는 분류예요');return}const at=ty==='expense'?arr.findIndex(c=>LOCKED.includes(c.name)):-1;arr.splice(at<0?arr.length:at,0,{name:v,icon:ty==='income'?'plusc':'dots'});SET.pick=at<0?arr.length-1:at;touch();openSettings()};
  $('#cpW').onclick=()=>{const w=REMOTE.watch||{stocks:[],crypto:[]};const out={stocks:[...new Set([...(w.stocks||[]),...nw.stocks])],crypto:[...new Set([...(w.crypto||[]),...nw.crypto])]};const txt=JSON.stringify(out,null,2);
    (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast('복사했어요')).catch(()=>{modal(`<div class="mhead"><h3>시세 목록</h3>${xbtn()}</div><textarea class="note" style="min-height:160px" readonly>${esc(txt)}</textarea>`)})};
  $('#syncNow').onclick=()=>{closeModal();syncRemote(true)};
  $('#exp').onclick=()=>{const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`가계달력_백업_${TK}.json`;document.body.appendChild(a);a.click();a.remove();toast('백업 파일을 만들었어요')};
  $('#impF').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=migrate(JSON.parse(rd.result));if(!o)throw 0;S=o;touch();closeModal();render();toast('백업을 불러왔어요')}catch(_){toast('이 앱에서 내보낸 백업 파일인지 확인해 주세요')}};rd.readAsText(f)};
  $('#reset').onclick=()=>{if(!SET.reset){SET.reset=true;SET.blank=false;openSettings();return}SET.reset=false;const keep=S.rcache;S=seed();S.rcache=keep||{};VER++;seedHistory(S);touch();closeModal();render();toast('예시 데이터로 바꿨어요')};
  $('#blankB').onclick=()=>{if(!SET.blank){SET.blank=true;SET.reset=false;openSettings();return}SET.blank=false;const keep=S.rcache;S=blank();S.rcache=keep||{};VER++;touch();closeModal();render();toast('빈 상태로 시작해요')};
}

/* ========== 시작 ========== */
if(!S){S=seed();seedHistory(S)}
VER++;snapshot();save();
$('#gear').innerHTML=ic('gear',20);$('#gear').onclick=()=>{SET.reset=false;SET.blank=false;SET.pick=null;openSettings()};
$('#sync').innerHTML=ic('refresh',19);$('#sync').onclick=()=>syncRemote(true);
$('#fabE').innerHTML=ic('minus',18)+'지출';$('#fabI').innerHTML=ic('plus',18)+'수입';
$('#fabE').onclick=()=>openForm({type:'expense',date:UI.view==='cal'?UI.sel:TK});
$('#fabI').onclick=()=>openForm({type:'income',date:UI.view==='cal'?UI.sel:TK});
render();
syncRemote(false);
if('serviceWorker' in navigator&&isWeb())navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
